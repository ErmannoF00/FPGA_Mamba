<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="650" viewBox="0 0 1770 650" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Mamba-derived classification pipeline and RTL scan boundary</title>
<desc id="diagram-desc">Eight input row tokens pass through a PyTorch model front end that generates input-dependent coefficients. A synthesizable fixed-point multi-state recurrent scan is tested in RTL. A PyTorch output path and classifier produce final predictions. Offline calibration configures per-state fractional precision at compile time.</desc>
